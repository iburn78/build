</div>

<script src="../../node/html/model_instance.js"></script>
<script src="../../node/html/qualitative.js"></script>
<script>
function openClassificationMap(link) {
    const popup = window.open(
        link.href,
        "classification-map",
        "popup=yes,width=1100,height=950,resizable=yes,scrollbars=yes"
    );
    if (!popup) return true;
    popup.focus();
    return false;
}
</script>
</body>
